<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工作流平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
header { background: #1a1a2e; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 600; letter-spacing: 1px; }
.main { display: flex; flex: 1; overflow: hidden; }

/* Tab */
.tabs { display: flex; align-items: center; border-bottom: 1px solid #e0e0e0; background: #fff; padding: 0 16px; gap: 4px; }
.tab { padding: 10px 18px; font-size: 14px; border: none; background: none; cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: #333; }
.tab.active { color: #1a1a2e; font-weight: 600; border-bottom-color: #1a1a2e; }
/* 工具栏 */
.toolbar { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.model-select { font-size: 13px; padding: 4px 8px; border: 1px solid #d0d0d0; border-radius: 6px; color: #333; background: #fafafa; cursor: pointer; outline: none; }
.model-select:focus { border-color: #1a1a2e; }
.toggle-wrap { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; user-select: none; cursor: pointer; }
.toggle-wrap input[type=checkbox] { display: none; }
.toggle-track { width: 32px; height: 18px; background: #ccc; border-radius: 9px; position: relative; transition: background 0.2s; flex-shrink: 0; }
.toggle-track::after { content: ''; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: left 0.2s; }
.toggle-wrap input:checked + .toggle-track { background: #1a73e8; }
.toggle-wrap input:checked + .toggle-track::after { left: 16px; }

/* 视图 */
.view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }
.chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #e0e0e0; overflow: hidden; }

/* 对话 */
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 78%; padding: 12px 16px; border-radius: 12px; line-height: 1.7; font-size: 14px; word-break: break-word; }
.msg.user { white-space: pre-wrap; align-self: flex-end; background: #1a1a2e; color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: #fff; color: #333; border-bottom-left-radius: 4px; border: 1px solid #e8e8e8; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.msg.loading { color: #999; font-style: italic; }
.chat-input { display: flex; gap: 10px; padding: 16px; border-top: 1px solid #e0e0e0; background: #fff; }
.chat-input textarea { flex: 1; padding: 10px 14px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 14px; resize: none; outline: none; font-family: inherit; line-height: 1.5; }
.chat-input textarea:focus { border-color: #1a1a2e; }
.chat-input button { padding: 10px 22px; background: #1a1a2e; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.chat-input button:hover { background: #16213e; }
.chat-input button:disabled { background: #aaa; cursor: not-allowed; }

/* 数据分析 */
.analysis-input-area { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-bottom: 1px solid #e0e0e0; background: #fff; }
.analysis-input-area label { font-size: 13px; color: #555; font-weight: 500; }
.analysis-input-area textarea { width: 100%; padding: 10px 14px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 13px; resize: vertical; outline: none; font-family: inherit; line-height: 1.6; min-height: 120px; }
.analysis-input-area textarea:focus { border-color: #1a1a2e; }
.analysis-input-area .btn-row { display: flex; justify-content: flex-end; }
.analysis-input-area button { padding: 9px 24px; background: #1a1a2e; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.analysis-input-area button:hover { background: #16213e; }
.analysis-input-area button:disabled { background: #aaa; cursor: not-allowed; }
.analysis-result { flex: 1; overflow-y: auto; padding: 20px; background: #f0f2f5; }
.analysis-result .placeholder, .analysis-loading { color: #bbb; font-size: 13px; text-align: center; padding-top: 40px; font-style: italic; }
.analysis-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); font-size: 14px; color: #333; line-height: 1.8; }
.analysis-meta { font-size: 12px; color: #bbb; margin-top: 16px; padding-top: 12px; border-top: 1px solid #f0f0f0; }

/* ── Markdown 内容 ── */
.md-body p { margin-bottom: 8px; }
.md-body h1 { font-size: 18px; margin: 16px 0 8px; }
.md-body h2 { font-size: 16px; margin: 14px 0 6px; }
.md-body h3 { font-size: 15px; margin: 12px 0 5px; }
.md-body ul, .md-body ol { padding-left: 22px; margin-bottom: 8px; }
.md-body li { margin-bottom: 3px; }
.md-body strong { font-weight: 600; }
.md-body em { font-style: italic; }
.md-body blockquote { border-left: 3px solid #d0d0d0; padding-left: 12px; color: #777; margin: 8px 0; }
/* 行内代码 */
.md-body code { background: #f0f0f0; color: #d63031; padding: 1px 6px; border-radius: 4px; font-size: 13px; font-family: "Fira Code", Consolas, monospace; }

/* ── 代码块（类 Claude 风格）── */
.code-block { margin: 10px 0; border-radius: 10px; overflow: hidden; border: 1px solid #30363d; }
.code-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: #21262d; border-bottom: 1px solid #30363d; }
.code-lang { font-size: 12px; color: #8b949e; font-family: monospace; }
.copy-btn { font-size: 12px; padding: 3px 10px; background: transparent; border: 1px solid #444; border-radius: 5px; color: #8b949e; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.copy-btn:hover { background: #30363d; color: #c9d1d9; }
.copy-btn.copied { color: #3fb950; border-color: #3fb950; }
.code-block pre { margin: 0; padding: 14px 16px; overflow-x: auto; background: #0d1117; }
.code-block pre code { display: block; font-family: "Fira Code", Consolas, monospace; font-size: 13px; line-height: 1.65; background: transparent; padding: 0; color: #c9d1d9; border-radius: 0; }

/* ── hljs token 颜色（内联确保优先级，不依赖 CDN CSS）── */
.code-block .hljs-comment, .code-block .hljs-quote { color: #8b949e !important; font-style: italic; }
.code-block .hljs-keyword, .code-block .hljs-selector-tag, .code-block .hljs-addition { color: #ff7b72 !important; }
.code-block .hljs-number, .code-block .hljs-literal, .code-block .hljs-deletion { color: #79c0ff !important; }
.code-block .hljs-string, .code-block .hljs-doctag, .code-block .hljs-regexp { color: #a5d6ff !important; }
.code-block .hljs-title, .code-block .hljs-section, .code-block .hljs-built_in { color: #d2a8ff !important; }
.code-block .hljs-class .hljs-title, .code-block .hljs-type { color: #f0883e !important; }
.code-block .hljs-tag, .code-block .hljs-name, .code-block .hljs-selector-id { color: #7ee787 !important; }
.code-block .hljs-attr, .code-block .hljs-selector-attr { color: #79c0ff !important; }
.code-block .hljs-variable, .code-block .hljs-template-variable { color: #ffa657 !important; }
.code-block .hljs-emphasis { font-style: italic; }
.code-block .hljs-strong { font-weight: bold; }

/* ── KaTeX ── */
.katex-display { overflow-x: auto; padding: 6px 0; }
.katex { font-size: 1.05em; }

/* 右侧历史 */
.history-panel { width: 320px; display: flex; flex-direction: column; background: #fafafa; }
.history-header { padding: 16px 20px; font-size: 15px; font-weight: 600; color: #333; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
.history-header button { font-size: 12px; padding: 4px 10px; background: #f0f2f5; border: 1px solid #d0d0d0; border-radius: 6px; cursor: pointer; color: #555; }
.history-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.record { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 14px; transition: box-shadow 0.2s; }
.record:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.record-time { font-size: 12px; color: #999; margin-bottom: 6px; }
.record-intent { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; font-weight: 500; }
.intent-问题 { background: #e8f4fd; color: #1a73e8; }
.intent-数据分析 { background: #e8f5e9; color: #2e7d32; }
.intent-other { background: #f0f0f0; color: #666; }
.record-answer { font-size: 13px; color: #444; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.record-cost { font-size: 11px; color: #bbb; margin-top: 6px; }
.node-timings { font-size: 11px; color: #bbb; margin-top: 8px; font-family: monospace; letter-spacing: 0.02em; }
.call-tree { background: #1a1a2e; border-radius: 10px; padding: 10px 14px 12px; margin-top: 10px; font-family: 'Consolas','Menlo',monospace; font-size: 12px; }
.call-tree-title { color: #7986cb; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.tree-row { display: flex; align-items: center; padding: 3px 0; gap: 7px; }
.tree-indent { color: #3d3d6b; white-space: pre; }
.tree-icon { color: #7986cb; flex-shrink: 0; font-style: normal; }
.tree-id { color: #81c784; font-weight: 600; min-width: 70px; }
.tree-type { color: #64b5f6; background: rgba(100,181,246,.15); padding: 1px 6px; border-radius: 3px; font-size: 11px; }
.tree-cost { color: #ffd54f; min-width: 52px; text-align: right; }
.tree-ok { color: #81c784; }
.tree-err { color: #ef5350; }
.empty { text-align: center; color: #bbb; font-size: 13px; padding: 40px 0; }
</style>
</head>
<body>
<header>🤖 AI 工作流平台</header>
<div class="main">

  <div class="chat-panel">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('chat')">💬 对话</button>
      <button class="tab" onclick="switchTab('analysis')">📊 数据分析</button>
      <div class="toolbar">
        <select class="model-select" id="providerSelect">
          <option value="tongyi">通义千问</option>
          <option value="deepseek">DeepSeek</option>
        </select>
        <select class="model-select" id="modelSelect">
          <option value="qwen-max">qwen-max</option>
          <option value="qwen-plus">qwen-plus</option>
          <option value="qwen-turbo">qwen-turbo</option>
          <option value="qwen-long">qwen-long</option>
        </select>
        <label class="toggle-wrap" id="searchWrap">
          <input type="checkbox" id="searchToggle">
          <span class="toggle-track"></span>
          🌐 联网
        </label>
      </div>
    </div>

    <!-- 对话 -->
    <div id="chatView" class="view active">
      <div class="chat-messages" id="messages">
        <div class="msg bot"><div class="md-body">你好！我是 AI 工作流助手，请输入你的问题。</div></div>
      </div>
      <div class="chat-input">
        <textarea id="input" rows="2" placeholder="输入问题，按 Enter 发送，Shift+Enter 换行"></textarea>
        <button id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </div>

    <!-- 数据分析 -->
    <div id="analysisView" class="view">
      <div class="analysis-input-area">
        <label>粘贴或输入待分析的数据</label>
        <textarea id="dataInput" placeholder="支持数值、文本、表格、时间序列等各类数据…"></textarea>
        <div class="btn-row">
          <button id="analysisBtn" onclick="runAnalysis()">开始分析</button>
        </div>
      </div>
      <div class="analysis-result" id="analysisResult">
        <div class="placeholder">分析结果将在此显示</div>
      </div>
    </div>
  </div>

  <!-- 右侧历史 -->
  <div class="history-panel">
    <div class="history-header">
      执行记录
      <button onclick="loadHistory()">刷新</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty">暂无记录</div>
    </div>
  </div>
</div>

<!-- 库：placed before inline script -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script>
marked.use({ breaks: true, gfm: true });

/* ── 代码高亮 + 复制按钮注入 ── */
function processCodeBlocks(container) {
  container.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code');
    if (!code) return;

    // 取出纯文本（供复制）
    const rawText = code.textContent;

    // 检测语言
    const langClass = [...code.classList].find(c => c.startsWith('language-'));
    const lang = langClass ? langClass.replace('language-', '') : '';

    // 语法高亮（用 highlight() 而非 highlightElement，避免 DOM 状态竞争）
    if (typeof hljs !== 'undefined') {
      try {
        const result = (lang && hljs.getLanguage(lang))
          ? hljs.highlight(rawText, { language: lang, ignoreIllegals: true })
          : hljs.highlightAuto(rawText);
        code.innerHTML = result.value;
      } catch (e) { /* 降级：保留原文本 */ }
    }
    code.className = 'hljs' + (lang ? ' language-' + lang : '');

    // 外层 wrapper
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block';
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(pre);

    // header：语言标签 + 复制按钮
    const header = document.createElement('div');
    header.className = 'code-header';

    const langLabel = document.createElement('span');
    langLabel.className = 'code-lang';
    langLabel.textContent = lang || 'plaintext';

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    btn.onclick = () => {
      const done = () => {
        btn.textContent = '✓ 已复制';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
      };
      const fallback = () => {
        try {
          const ta = Object.assign(document.createElement('textarea'),
            { value: rawText, style: 'position:fixed;opacity:0' });
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (e) {}
        done();
      };
      navigator.clipboard ? navigator.clipboard.writeText(rawText).then(done).catch(fallback) : fallback();
    };

    header.appendChild(langLabel);
    header.appendChild(btn);
    wrapper.insertBefore(header, pre);
  });
}

/* ── 数学公式渲染 ── */
function processMath(container) {
  if (!window.renderMathInElement) return;
  renderMathInElement(container, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$',  right: '$',  display: false },
      { left: '\\(', right: '\\)', display: false },
      { left: '\\[', right: '\\]', display: true }
    ],
    throwOnError: false
  });
}

/* ── 统一渲染入口 ── */
function renderMarkdown(text, container) {
  // 用独立 div 包裹，避免 md-body 样式污染气泡布局
  const body = document.createElement('div');
  body.className = 'md-body';
  body.innerHTML = marked.parse(text);
  container.innerHTML = '';
  container.appendChild(body);

  processCodeBlocks(body);
  processMath(body);
}

/* ── DOM 引用 ── */
const input          = document.getElementById('input');
const sendBtn        = document.getElementById('sendBtn');
const messages       = document.getElementById('messages');
const historyList    = document.getElementById('historyList');
const dataInput      = document.getElementById('dataInput');
const analysisBtn    = document.getElementById('analysisBtn');
const analysisResult = document.getElementById('analysisResult');
const providerSelect = document.getElementById('providerSelect');
const modelSelect    = document.getElementById('modelSelect');
const searchToggle   = document.getElementById('searchToggle');
const searchWrap     = document.getElementById('searchWrap');

const PROVIDER_MODELS = {
  tongyi:   ['qwen-max', 'qwen-plus', 'qwen-turbo', 'qwen-long'],
  deepseek: ['deepseek-chat', 'deepseek-reasoner']
};

providerSelect.addEventListener('change', () => {
  const models = PROVIDER_MODELS[providerSelect.value];
  modelSelect.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
  searchWrap.style.display = providerSelect.value === 'deepseek' ? 'none' : '';
});

const getProvider     = () => providerSelect.value;
const getModel        = () => modelSelect.value;
const getEnableSearch = () => searchToggle.checked;

/* ── 调用树 ── */
const NODE_ICONS = { '分类':'⊕', '生成':'⊞', '拦截':'⊘', '分析':'⊙', '汇总':'⊟' };

function renderCallTree(nodes, container) {
  if (!nodes || !nodes.length) return;
  const panel = document.createElement('div');
  panel.className = 'call-tree';

  const title = document.createElement('div');
  title.className = 'call-tree-title';
  title.textContent = '调用树';
  panel.appendChild(title);

  nodes.forEach(node => {
    const row = document.createElement('div');
    row.className = 'tree-row';
    const depth = node.depth || 0;

    const indent = document.createElement('span');
    indent.className = 'tree-indent';
    indent.textContent = depth === 0 ? '' : '  '.repeat(depth - 1) + '└─ ';

    const icon = document.createElement('span');
    icon.className = 'tree-icon';
    icon.textContent = NODE_ICONS[node.nodeType] || '●';

    const id = document.createElement('span');
    id.className = 'tree-id';
    id.textContent = node.nodeId;

    const type = document.createElement('span');
    type.className = 'tree-type';
    type.textContent = node.nodeType;

    const cost = document.createElement('span');
    cost.className = 'tree-cost';
    cost.textContent = node.costMs + 'ms';

    const status = document.createElement('span');
    status.className = node.status === 'success' ? 'tree-ok' : 'tree-err';
    status.textContent = node.status === 'success' ? '✓' : '✗';

    row.append(indent, icon, id, type, cost, status);
    panel.appendChild(row);
  });

  container.appendChild(panel);
}

/* ── Tab 切换 ── */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((el, i) =>
    el.classList.toggle('active', (tab === 'chat') === (i === 0)));
  document.getElementById('chatView').classList.toggle('active', tab === 'chat');
  document.getElementById('analysisView').classList.toggle('active', tab === 'analysis');
}

/* ── 对话 ── */
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function appendMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (type === 'bot') {
    renderMarkdown(text, div);
  } else {
    div.textContent = text;
  }
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  appendMsg(text, 'user');
  const loading = appendMsg('思考中...', 'bot loading');
  try {
    const res  = await fetch('/workflow?message=' + encodeURIComponent(text)
                           + '&provider=' + getProvider()
                           + '&model=' + getModel()
                           + '&enableSearch=' + getEnableSearch());
    const data = await res.json();
    loading.className = 'msg bot';
    renderMarkdown(data.answer, loading);
    if (data.nodeTimings) {
      const t = document.createElement('div');
      t.className = 'node-timings';
      t.textContent = data.nodeTimings;
      loading.appendChild(t);
    }
    renderCallTree(data.callTree, loading);
    loadHistory();
  } catch (e) {
    loading.className = 'msg bot';
    loading.textContent = '请求失败，请重试。';
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

/* ── 数据分析 ── */
async function runAnalysis() {
  const data = dataInput.value.trim();
  if (!data) return;
  analysisBtn.disabled = true;
  analysisResult.innerHTML = '<div class="analysis-loading">分析中，请稍候...</div>';
  try {
    const res  = await fetch('/analysis?data=' + encodeURIComponent(data)
                           + '&provider=' + getProvider()
                           + '&model=' + getModel()
                           + '&enableSearch=' + getEnableSearch());
    const json = await res.json();

    const card = document.createElement('div');
    card.className = 'analysis-card';

    const body = document.createElement('div');
    renderMarkdown(json.answer, body);
    card.appendChild(body);

    const meta = document.createElement('div');
    meta.className = 'analysis-meta';
    meta.textContent = `耗时 ${json.costMs}ms · ${json.timestamp}`;
    if (json.nodeTimings) {
      const t = document.createElement('div');
      t.className = 'node-timings';
      t.textContent = json.nodeTimings;
      meta.appendChild(t);
    }
    card.appendChild(meta);
    renderCallTree(json.callTree, card);

    analysisResult.innerHTML = '';
    analysisResult.appendChild(card);
    loadHistory();
  } catch (e) {
    analysisResult.innerHTML = '<div class="placeholder">分析失败，请重试。</div>';
  } finally {
    analysisBtn.disabled = false;
  }
}

/* ── 历史记录 ── */
async function loadHistory() {
  try {
    const res  = await fetch('/history');
    const list = await res.json();
    if (!list.length) { historyList.innerHTML = '<div class="empty">暂无记录</div>'; return; }
    historyList.innerHTML = list.map(r => {
      const cls = r.intent === '数据分析' ? 'intent-数据分析'
                : r.intent?.includes('问题') ? 'intent-问题' : 'intent-other';
      return `<div class="record">
        <div class="record-time">${r.timestamp}</div>
        <span class="record-intent ${cls}">${r.intent}</span>
        ${r.model ? `<span class="record-intent intent-other" style="margin-left:4px">${r.model}</span>` : ''}
        ${r.provider ? `<span class="record-intent intent-other" style="margin-left:4px;background:#e8f4fd;color:#1a73e8">${r.provider === 'deepseek' ? 'DeepSeek' : '通义'}</span>` : ''}
        <div class="record-answer">${r.answer}</div>
        <div class="record-cost">耗时 ${r.costMs}ms${r.nodeTimings ? `<span class="node-timings" style="display:inline;margin:0 0 0 6px">${r.nodeTimings}</span>` : ''}</div>
      </div>`;
    }).join('');
  } catch(e) {}
}

loadHistory();
</script>
</body>
</html>
