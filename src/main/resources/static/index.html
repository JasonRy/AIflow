<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工作流平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
header { background: #1a1a2e; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 600; letter-spacing: 1px; }
.main { display: flex; flex: 1; overflow: hidden; }

/* Tab */
.tabs { display: flex; align-items: center; border-bottom: 1px solid #e0e0e0; background: #fff; padding: 0 16px; gap: 4px; }
.tab { padding: 10px 18px; font-size: 14px; border: none; background: none; cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: #333; }
.tab.active { color: #1a1a2e; font-weight: 600; border-bottom-color: #1a1a2e; }
/* 工具栏 */
.toolbar { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.model-select { font-size: 13px; padding: 4px 8px; border: 1px solid #d0d0d0; border-radius: 6px; color: #333; background: #fafafa; cursor: pointer; outline: none; }
.model-select:focus { border-color: #1a1a2e; }
.toggle-wrap { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; user-select: none; cursor: pointer; }
.toggle-wrap input[type=checkbox] { display: none; }
.toggle-track { width: 32px; height: 18px; background: #ccc; border-radius: 9px; position: relative; transition: background 0.2s; flex-shrink: 0; }
.toggle-track::after { content: ''; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: left 0.2s; }
.toggle-wrap input:checked + .toggle-track { background: #1a73e8; }
.toggle-wrap input:checked + .toggle-track::after { left: 16px; }

/* 视图 */
.view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }
.chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #e0e0e0; overflow: hidden; }

/* 对话 */
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 78%; padding: 12px 16px; border-radius: 12px; line-height: 1.7; font-size: 14px; word-break: break-word; }
.msg.user { white-space: pre-wrap; align-self: flex-end; background: #1a1a2e; color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: #fff; color: #333; border-bottom-left-radius: 4px; border: 1px solid #e8e8e8; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.msg.loading { color: #999; font-style: italic; }
.chat-input { display: flex; gap: 10px; padding: 16px; border-top: 1px solid #e0e0e0; background: #fff; }
.chat-input textarea { flex: 1; padding: 10px 14px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 14px; resize: none; outline: none; font-family: inherit; line-height: 1.5; }
.chat-input textarea:focus { border-color: #1a1a2e; }
.chat-input button { padding: 10px 22px; background: #1a1a2e; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.chat-input button:hover { background: #16213e; }
.chat-input button:disabled { background: #aaa; cursor: not-allowed; }

/* 数据分析 */
.analysis-input-area { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-bottom: 1px solid #e0e0e0; background: #fff; }
.analysis-input-area label { font-size: 13px; color: #555; font-weight: 500; }
.analysis-input-area textarea { width: 100%; padding: 10px 14px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 13px; resize: vertical; outline: none; font-family: inherit; line-height: 1.6; min-height: 120px; }
.analysis-input-area textarea:focus { border-color: #1a1a2e; }
.analysis-input-area .btn-row { display: flex; justify-content: flex-end; }
.analysis-input-area button { padding: 9px 24px; background: #1a1a2e; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.analysis-input-area button:hover { background: #16213e; }
.analysis-input-area button:disabled { background: #aaa; cursor: not-allowed; }
.analysis-result { flex: 1; overflow-y: auto; padding: 20px; background: #f0f2f5; }
.analysis-result .placeholder, .analysis-loading { color: #bbb; font-size: 13px; text-align: center; padding-top: 40px; font-style: italic; }
.analysis-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); font-size: 14px; color: #333; line-height: 1.8; }
.analysis-meta { font-size: 12px; color: #bbb; margin-top: 16px; padding-top: 12px; border-top: 1px solid #f0f0f0; }

/* ── Markdown 内容 ── */
.md-body p { margin-bottom: 8px; }
.md-body h1 { font-size: 18px; margin: 16px 0 8px; }
.md-body h2 { font-size: 16px; margin: 14px 0 6px; }
.md-body h3 { font-size: 15px; margin: 12px 0 5px; }
.md-body ul, .md-body ol { padding-left: 22px; margin-bottom: 8px; }
.md-body li { margin-bottom: 3px; }
.md-body strong { font-weight: 600; }
.md-body em { font-style: italic; }
.md-body blockquote { border-left: 3px solid #d0d0d0; padding-left: 12px; color: #777; margin: 8px 0; }
/* 行内代码 */
.md-body code { background: #f0f0f0; color: #d63031; padding: 1px 6px; border-radius: 4px; font-size: 13px; font-family: "Fira Code", Consolas, monospace; }

/* ── 代码块（类 Claude 风格）── */
.code-block { margin: 10px 0; border-radius: 10px; overflow: hidden; border: 1px solid #30363d; }
.code-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: #21262d; border-bottom: 1px solid #30363d; }
.code-lang { font-size: 12px; color: #8b949e; font-family: monospace; }
.copy-btn { font-size: 12px; padding: 3px 10px; background: transparent; border: 1px solid #444; border-radius: 5px; color: #8b949e; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.copy-btn:hover { background: #30363d; color: #c9d1d9; }
.copy-btn.copied { color: #3fb950; border-color: #3fb950; }
.code-block pre { margin: 0; padding: 14px 16px; overflow-x: auto; background: #0d1117; }
.code-block pre code { display: block; font-family: "Fira Code", Consolas, monospace; font-size: 13px; line-height: 1.65; background: transparent; padding: 0; color: #c9d1d9; border-radius: 0; }

/* ── hljs token 颜色（内联确保优先级，不依赖 CDN CSS）── */
.code-block .hljs-comment, .code-block .hljs-quote { color: #8b949e !important; font-style: italic; }
.code-block .hljs-keyword, .code-block .hljs-selector-tag, .code-block .hljs-addition { color: #ff7b72 !important; }
.code-block .hljs-number, .code-block .hljs-literal, .code-block .hljs-deletion { color: #79c0ff !important; }
.code-block .hljs-string, .code-block .hljs-doctag, .code-block .hljs-regexp { color: #a5d6ff !important; }
.code-block .hljs-title, .code-block .hljs-section, .code-block .hljs-built_in { color: #d2a8ff !important; }
.code-block .hljs-class .hljs-title, .code-block .hljs-type { color: #f0883e !important; }
.code-block .hljs-tag, .code-block .hljs-name, .code-block .hljs-selector-id { color: #7ee787 !important; }
.code-block .hljs-attr, .code-block .hljs-selector-attr { color: #79c0ff !important; }
.code-block .hljs-variable, .code-block .hljs-template-variable { color: #ffa657 !important; }
.code-block .hljs-emphasis { font-style: italic; }
.code-block .hljs-strong { font-weight: bold; }

/* ── KaTeX ── */
.katex-display { overflow-x: auto; padding: 6px 0; }
.katex { font-size: 1.05em; }

/* 右侧对话历史 */
.history-panel { width: 360px; display: flex; flex-direction: column; background: #fafafa; }
.history-header { padding: 16px 20px; font-size: 15px; font-weight: 600; color: #333; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
.history-header button { font-size: 12px; padding: 4px 10px; background: #f0f2f5; border: 1px solid #d0d0d0; border-radius: 6px; cursor: pointer; color: #555; }
.history-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.record { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px; transition: box-shadow 0.2s; }
.record:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.record-time { font-size: 12px; color: #999; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.record-intent { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; font-weight: 500; }
.intent-问题 { background: #e8f4fd; color: #1a73e8; }
.intent-数据分析 { background: #e8f5e9; color: #2e7d32; }
.intent-other { background: #f0f0f0; color: #666; }
.history-chat { display: flex; flex-direction: column; gap: 8px; }
.history-message { display: flex; flex-direction: column; gap: 4px; }
.history-role { font-size: 11px; color: #8a8f98; font-weight: 600; }
.history-bubble { font-size: 13px; line-height: 1.55; padding: 9px 10px; border-radius: 10px; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.history-bubble.user { background: #1a1a2e; color: #fff; border-bottom-right-radius: 4px; }
.history-bubble.assistant { background: #f6f8fb; color: #333; border: 1px solid #edf0f5; border-bottom-left-radius: 4px; }
.record-cost { font-size: 11px; color: #9aa0a6; margin-top: 8px; }
.node-timings { font-size: 11px; color: #8a8f98; margin-top: 8px; font-family: monospace; letter-spacing: 0.02em; }
.call-tree { background: #fff; border: 1px solid #edf2f7; border-radius: 8px; margin-top: 12px; padding: 0 0 6px; overflow: hidden; font-size: 13px; color: #2d5f86; }
.call-tree-title { display: inline-flex; align-items: center; height: 34px; padding: 0 0 0 22px; color: #1677a8; font-size: 14px; font-weight: 700; border-bottom: 2px solid #45b4d4; }
.tree-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px; align-items: center; gap: 12px; min-height: 40px; padding: 0 26px 0 18px; }
.tree-row:nth-child(2) { background: #edf8ff; }
.tree-main { display: flex; align-items: center; min-width: 0; gap: 9px; }
.tree-spacer { flex: 0 0 auto; width: calc(var(--depth) * 28px); }
.tree-caret { color: #8fb2c5; flex: 0 0 12px; font-size: 15px; line-height: 1; }
.tree-status { color: #23a35a; flex: 0 0 16px; font-size: 16px; font-weight: 700; }
.tree-status.tree-err { color: #df4d43; }
.tree-badge { flex: 0 0 28px; width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 700; box-shadow: inset 0 -1px 0 rgba(0,0,0,0.08); }
.tree-badge.start { background: #49a8ee; }
.tree-badge.http { background: #49a8ee; }
.tree-badge.intent, .tree-badge.condition { background: #ff982f; }
.tree-badge.llm { background: #20242a; }
.tree-badge.setvariable, .tree-badge.set_variable { background: #45aeea; }
.tree-badge.code { background: #2fc196; }
.tree-badge.loop { background: #9067e9; }
.tree-badge.end { background: #49a8ee; }
.tree-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #2a75a3; }
.tree-cost { color: #2a75a3; text-align: right; font-family: Consolas, Menlo, monospace; }
.empty { text-align: center; color: #bbb; font-size: 13px; padding: 40px 0; }

/* 工作流定义测试 */
.workflow-board { flex: 1; display: grid; grid-template-columns: 300px minmax(420px, 1fr) 320px; min-height: 0; background: #eef1f5; }
.workflow-form { background: #fff; border-right: 1px solid #dfe4ea; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.workflow-form label { font-size: 12px; color: #4b5563; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
.workflow-form input, .workflow-form textarea { width: 100%; padding: 9px 11px; border: 1px solid #d5dbe4; border-radius: 7px; font-size: 13px; font-family: inherit; outline: none; background: #fff; }
.workflow-form textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
.workflow-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.workflow-actions button, .workflow-form .wide-btn { padding: 9px 12px; border: none; border-radius: 7px; background: #1f2a44; color: #fff; font-size: 13px; cursor: pointer; }
.workflow-actions button.secondary { background: #f5f7fa; color: #253044; border: 1px solid #d5dbe4; }
.workflow-actions button:disabled, .workflow-form .wide-btn:disabled { background: #aeb7c4; cursor: not-allowed; }
.workflow-form .ghost-btn { padding: 9px 12px; border-radius: 7px; background: #fff; color: #253044; border: 1px solid #d5dbe4; font-size: 13px; cursor: pointer; }
.workflow-form .ghost-btn:disabled { color: #9aa3b2; cursor: not-allowed; }
.workflow-run-result { background: #f8fafc; border: 1px solid #e1e7ef; border-radius: 7px; padding: 10px; font-size: 13px; line-height: 1.6; color: #2f3a4a; min-height: 48px; max-height: 180px; overflow-y: auto; }
.workflow-status { min-height: 20px; font-size: 12px; color: #607086; line-height: 1.5; }
.workflow-status.error { color: #c62828; }
.workflow-section-title { font-size: 12px; font-weight: 700; color: #253044; margin: 2px 0 0; }
.workflow-section-note { font-size: 12px; color: #7a8699; line-height: 1.5; }
.workflow-template-list, .workflow-step-library { display: flex; flex-direction: column; gap: 8px; }
.workflow-template-btn, .workflow-step-btn { text-align: left; border: 1px solid #dfe5ee; border-radius: 8px; background: #fff; padding: 10px; cursor: pointer; color: #253044; }
.workflow-template-btn strong, .workflow-step-btn strong { display: block; font-size: 13px; margin-bottom: 4px; }
.workflow-template-btn span, .workflow-step-btn span { display: block; font-size: 12px; color: #6f7d90; line-height: 1.4; }
.workflow-template-btn:hover, .workflow-step-btn:hover { border-color: #9ab5d6; background: #f8fbff; }
.workflow-template-btn:disabled, .workflow-step-btn:disabled { cursor: not-allowed; color: #9aa3b2; background: #f7f9fc; }
.workflow-canvas-panel { min-width: 0; min-height: 0; display: grid; grid-template-rows: 48px 1fr auto; background: #f7f9fc; }
.workflow-canvas-toolbar { height: 48px; border-bottom: 1px solid #dfe4ea; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; color: #253044; background: #fff; }
.workflow-canvas-title { font-size: 14px; font-weight: 700; }
.workflow-canvas-subtitle { font-size: 12px; color: #7a8699; margin-left: 10px; font-weight: 400; }
.workflow-canvas-actions { display: flex; align-items: center; gap: 8px; }
.workflow-chip { font-size: 12px; color: #526174; background: #f3f6fa; border: 1px solid #dce3ec; border-radius: 999px; padding: 4px 9px; }
.workflow-toolbar-btn { border: 1px solid #d5dbe4; border-radius: 7px; background: #fff; color: #253044; font-size: 13px; padding: 7px 11px; cursor: pointer; }
.workflow-toolbar-btn.primary { background: #1f2a44; border-color: #1f2a44; color: #fff; }
.workflow-toolbar-btn:disabled { background: #edf1f6; color: #9aa3b2; cursor: not-allowed; }
.workflow-canvas { position: relative; min-height: 0; padding: 24px; overflow: auto; background-color: #f7f9fc; background-image: radial-gradient(#d8dee8 1px, transparent 1px); background-size: 18px 18px; }
.workflow-run-dock { border-top: 1px solid #dfe4ea; background: #fff; padding: 12px 16px; display: grid; grid-template-columns: minmax(220px, 1fr) auto; gap: 10px; align-items: start; }
.workflow-run-dock textarea { width: 100%; min-height: 48px; max-height: 110px; resize: vertical; border: 1px solid #d5dbe4; border-radius: 8px; padding: 9px 11px; font: inherit; font-size: 13px; line-height: 1.5; outline: none; }
.workflow-run-dock textarea:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
.workflow-viewport { position: relative; min-width: 100%; min-height: 100%; }
.workflow-edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.workflow-edge { stroke: #9aa8ba; stroke-width: 2; fill: none; }
.workflow-edge-label { fill: #637083; font-size: 11px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.workflow-node { position: absolute; width: 176px; min-height: 78px; border: 1px solid #d3dae5; border-radius: 8px; padding: 11px 12px; background: #fff; box-shadow: 0 6px 18px rgba(31,42,68,0.08); }
.workflow-node { cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s; }
.workflow-node:hover { border-color: #8fb2d9; box-shadow: 0 8px 22px rgba(31,42,68,0.12); }
.workflow-node.selected { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.14), 0 8px 22px rgba(31,42,68,0.12); }
.workflow-node-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.workflow-node-icon { width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; flex: 0 0 auto; }
.workflow-node-icon.start, .workflow-node-icon.end { background: #4aa3ef; }
.workflow-node-icon.llm { background: #222831; }
.workflow-node-icon.condition { background: #ff982f; }
.workflow-node-icon.set_variable, .workflow-node-icon.setvariable { background: #45aeea; }
.workflow-node-icon.code { background: #2fc196; }
.workflow-node-title { font-size: 14px; font-weight: 700; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workflow-node-type { display: inline-block; font-size: 11px; color: #526174; background: #f3f6fa; padding: 2px 7px; border-radius: 999px; margin-bottom: 5px; }
.workflow-node-key { font-size: 12px; color: #7a8699; font-family: Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workflow-node-desc { margin-top: 7px; font-size: 12px; line-height: 1.45; color: #637083; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.workflow-node-delete { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 4px; border: none; background: transparent; color: #b0bec5; font-size: 13px; cursor: pointer; display: none; align-items: center; justify-content: center; padding: 0; line-height: 1; }
.workflow-node:hover .workflow-node-delete { display: flex; }
.workflow-node-delete:hover { background: #fee2e2; color: #dc2626; }
.workflow-inspector { min-width: 0; background: #fff; border-left: 1px solid #dfe4ea; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.workflow-panel-title { font-size: 13px; font-weight: 700; color: #253044; margin-bottom: 10px; }
.workflow-summary { display: grid; grid-template-columns: 1fr; gap: 8px; }
.workflow-metric { border: 1px solid #e3e8ef; border-radius: 7px; padding: 10px; min-width: 0; background: #fbfcfe; }
.workflow-metric span { display: block; font-size: 11px; color: #8a8f98; margin-bottom: 4px; }
.workflow-metric strong { display: block; font-size: 13px; color: #202124; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workflow-node-list { display: flex; flex-direction: column; gap: 8px; }
.workflow-node-item { border: 1px solid #e3e8ef; border-radius: 7px; padding: 10px; background: #fff; }
.workflow-node-item { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.workflow-node-item:hover { border-color: #b7c4d5; background: #fbfcfe; }
.workflow-node-item.selected { border-color: #1a73e8; background: #f0f7ff; }
.workflow-node-item-title { font-size: 13px; font-weight: 700; color: #253044; margin-bottom: 4px; }
.workflow-node-item-meta { font-size: 12px; color: #7a8699; font-family: Consolas, monospace; }
.workflow-node-item-desc { margin-top: 6px; font-size: 12px; color: #637083; line-height: 1.45; }
.workflow-editor { border: 1px solid #e3e8ef; border-radius: 7px; background: #fbfcfe; padding: 12px; }
.workflow-editor-empty { color: #8a8f98; font-size: 13px; line-height: 1.6; }
.workflow-editor label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #4b5563; font-weight: 600; margin-bottom: 10px; }
.workflow-editor input, .workflow-editor textarea, .workflow-editor select { width: 100%; border: 1px solid #d5dbe4; border-radius: 7px; padding: 8px 10px; font: inherit; font-size: 13px; outline: none; background: #fff; }
.workflow-editor textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.workflow-editor input:focus, .workflow-editor textarea:focus, .workflow-editor select:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
.workflow-editor-meta { font-size: 12px; color: #7a8699; font-family: Consolas, monospace; margin-bottom: 12px; }
.workflow-editor details { border: 1px solid #e3e8ef; border-radius: 7px; background: #fff; margin-top: 10px; }
.workflow-editor summary { cursor: pointer; padding: 9px 10px; font-size: 12px; font-weight: 700; color: #526174; }
.workflow-editor details .advanced-fields { padding: 0 10px 10px; }
.workflow-debug { border: 1px solid #e3e8ef; border-radius: 7px; background: #fbfcfe; }
.workflow-debug summary { cursor: pointer; padding: 10px; font-size: 13px; font-weight: 700; color: #253044; }

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script>
marked.use({ breaks: true, gfm: true });

/* ── 代码高亮 + 复制按钮注入 ── */
function processCodeBlocks(container) {
  container.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code');
    if (!code) return;

    // 取出纯文本（供复制）
    const rawText = code.textContent;

    // 检测语言
    const langClass = [...code.classList].find(c => c.startsWith('language-'));
    const lang = langClass ? langClass.replace('language-', '') : '';

    // 语法高亮（用 highlight() 而非 highlightElement，避免 DOM 状态竞争）
    if (typeof hljs !== 'undefined') {
      try {
        const result = (lang && hljs.getLanguage(lang))
          ? hljs.highlight(rawText, { language: lang, ignoreIllegals: true })
          : hljs.highlightAuto(rawText);
        code.innerHTML = result.value;
      } catch (e) { /* 降级：保留原文本 */ }
    }
    code.className = 'hljs' + (lang ? ' language-' + lang : '');

    // 外层 wrapper
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block';
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(pre);

    // header：语言标签 + 复制按钮
    const header = document.createElement('div');
    header.className = 'code-header';

    const langLabel = document.createElement('span');
    langLabel.className = 'code-lang';
    langLabel.textContent = lang || 'plaintext';

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    btn.onclick = () => {
      const done = () => {
        btn.textContent = '✓ 已复制';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
      };
      const fallback = () => {
        try {
          const ta = Object.assign(document.createElement('textarea'),
            { value: rawText, style: 'position:fixed;opacity:0' });
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (e) {}
        done();
      };
      navigator.clipboard ? navigator.clipboard.writeText(rawText).then(done).catch(fallback) : fallback();
    };

    header.appendChild(langLabel);
    header.appendChild(btn);
    wrapper.insertBefore(header, pre);
  });
}

/* ── 数学公式渲染 ── */
function processMath(container) {
  if (!window.renderMathInElement) return;
  renderMathInElement(container, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$',  right: '$',  display: false },
      { left: '\\(', right: '\\)', display: false },
      { left: '\\[', right: '\\]', display: true }
    ],
    throwOnError: false
  });
}

/* ── 统一渲染入口 ── */
function renderMarkdown(text, container) {
  // 用独立 div 包裹，避免 md-body 样式污染气泡布局
  const body = document.createElement('div');
  body.className = 'md-body';
  body.innerHTML = marked.parse(text);
  container.innerHTML = '';
  container.appendChild(body);

  processCodeBlocks(body);
  processMath(body);
}

/* ── DOM 引用 ── */
const input          = document.getElementById('input');
const sendBtn        = document.getElementById('sendBtn');
const messages       = document.getElementById('messages');
const historyList    = document.getElementById('historyList');
const dataInput      = document.getElementById('dataInput');
const analysisBtn    = document.getElementById('analysisBtn');
const analysisResult = document.getElementById('analysisResult');
const providerSelect = document.getElementById('providerSelect');
const modelSelect    = document.getElementById('modelSelect');
const searchToggle   = document.getElementById('searchToggle');
const searchWrap     = document.getElementById('searchWrap');
const workflowStatus = document.getElementById('workflowStatus');
const workflowCanvas = document.getElementById('workflowCanvas');
const workflowSummary = document.getElementById('workflowSummary');
const workflowCanvasSubtitle = document.getElementById('workflowCanvasSubtitle');
const workflowNodeCount = document.getElementById('workflowNodeCount');
const workflowEdgeCount = document.getElementById('workflowEdgeCount');
const workflowNodeList = document.getElementById('workflowNodeList');
const workflowNodeEditor = document.getElementById('workflowNodeEditor');
const workflowJson = document.getElementById('workflowJson');
const saveDraftBtn = document.getElementById('saveDraftBtn');
const saveBranchDraftBtn = document.getElementById('saveBranchDraftBtn');
const saveCurrentDraftBtn = document.getElementById('saveCurrentDraftBtn');
const runWorkflowBtn = document.getElementById('runWorkflowBtn');
const workflowRunResult = document.getElementById('workflowRunResult');

const PROVIDER_MODELS = {
  tongyi:   ['qwen-max', 'qwen-plus', 'qwen-turbo', 'qwen-long'],
  deepseek: ['deepseek-chat', 'deepseek-reasoner']
};

providerSelect.addEventListener('change', () => {
  const models = PROVIDER_MODELS[providerSelect.value];
  modelSelect.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
  searchWrap.style.display = providerSelect.value === 'deepseek' ? 'none' : '';
});

const getProvider     = () => providerSelect.value;
const getModel        = () => modelSelect.value;
const getEnableSearch = () => searchToggle.checked;

/* ── 调用树 ── */
const NODE_META = {
  start: { icon: '▶', label: '用户输入', cls: 'start' },
  http: { icon: '◎', label: '调用工作流节点', cls: 'http' },
  intent: { icon: '●', label: '调用工作流节点', cls: 'intent' },
  condition: { icon: 'IF', label: '调用工作流节点', cls: 'condition' },
  llm: { icon: '✦', label: '调用LLM', cls: 'llm' },
  setvariable: { icon: 'x', label: '调用工作流节点', cls: 'setvariable' },
  set_variable: { icon: 'x', label: '调用工作流节点', cls: 'set_variable' },
  code: { icon: '</>', label: '调用工作流节点', cls: 'code' },
  loop: { icon: '↻', label: '调用工作流节点', cls: 'loop' },
  end: { icon: '↻', label: '结束', cls: 'end' },
  '分类': { icon: '●', label: '调用工作流节点', cls: 'intent' },
  '生成': { icon: '✦', label: '调用LLM', cls: 'llm' },
  '拦截': { icon: 'IF', label: '调用工作流节点', cls: 'condition' },
  '分析': { icon: '</>', label: '调用工作流节点', cls: 'code' },
  '汇总': { icon: '✦', label: '调用LLM', cls: 'llm' }
};

function nodeMeta(nodeType) {
  return NODE_META[nodeType] || { icon: '●', label: '调用工作流节点', cls: String(nodeType || 'node').replaceAll('_', '') };
}

function renderCallTree(nodes, container) {
  if (!nodes || !nodes.length) return;
  const panel = document.createElement('div');
  panel.className = 'call-tree';

  const title = document.createElement('div');
  title.className = 'call-tree-title';
  title.textContent = '调用树';
  panel.appendChild(title);

  nodes.forEach((node, index) => {
    const meta = nodeMeta(node.nodeType);
    const row = document.createElement('div');
    row.className = 'tree-row';
    const depth = node.depth || 0;
    row.style.setProperty('--depth', depth);

    const main = document.createElement('div');
    main.className = 'tree-main';

    const spacer = document.createElement('span');
    spacer.className = 'tree-spacer';

    const caret = document.createElement('span');
    caret.className = 'tree-caret';
    caret.textContent = index < nodes.length - 1 ? '⌄' : '';

    const status = document.createElement('span');
    status.className = node.status === 'success' ? 'tree-status' : 'tree-status tree-err';
    status.textContent = node.status === 'success' ? '✓' : '✕';

    const badge = document.createElement('span');
    badge.className = 'tree-badge ' + meta.cls;
    badge.textContent = meta.icon;

    const label = document.createElement('span');
    label.className = 'tree-label';
    label.textContent = `${meta.label} ${node.nodeId || ''}`.trim();

    const cost = document.createElement('span');
    cost.className = 'tree-cost';
    cost.textContent = `${node.costMs ?? 0}ms`;

    main.append(spacer, caret, status, badge, label);
    row.append(main, cost);
    panel.appendChild(row);
  });

  container.appendChild(panel);
}

/* ── Tab 切换 ── */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(el =>
    el.classList.toggle('active', el.dataset.tab === tab));
  document.getElementById('chatView').classList.toggle('active', tab === 'chat');
  document.getElementById('analysisView').classList.toggle('active', tab === 'analysis');
  document.getElementById('workflowView').classList.toggle('active', tab === 'workflow');
  if (tab === 'workflow') loadWorkflowDefinitions();
}

/* ── 对话 ── */
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function appendMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (type === 'bot') {
    renderMarkdown(text, div);
  } else {
    div.textContent = text;
  }
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  appendMsg(text, 'user');
  const loading = appendMsg('思考中...', 'bot loading');
  try {
    const res = await fetch('/api/workflows/chat/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        provider: getProvider(),
        model: getModel(),
        enableSearch: getEnableSearch()
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || '请求失败');
    loading.className = 'msg bot';
    renderMarkdown(data.answer, loading);
    if (data.nodeTimings) {
      const t = document.createElement('div');
      t.className = 'node-timings';
      t.textContent = data.nodeTimings;
      loading.appendChild(t);
    }
    renderCallTree(data.callTree, loading);
    loadHistory();
  } catch (e) {
    loading.className = 'msg bot';
    loading.textContent = e.message || '请求失败，请重试。';
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

/* ── 数据分析 ── */
async function runAnalysis() {
  const data = dataInput.value.trim();
  if (!data) return;
  analysisBtn.disabled = true;
  analysisResult.innerHTML = '<div class="analysis-loading">分析中，请稍候...</div>';
  try {
    const res = await fetch('/api/workflows/analysis/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        data,
        provider: getProvider(),
        model: getModel(),
        enableSearch: getEnableSearch()
      })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.message || '分析失败');

    const card = document.createElement('div');
    card.className = 'analysis-card';

    const body = document.createElement('div');
    renderMarkdown(json.answer, body);
    card.appendChild(body);

    const meta = document.createElement('div');
    meta.className = 'analysis-meta';
    meta.textContent = `耗时 ${json.costMs}ms · ${json.timestamp}`;
    if (json.nodeTimings) {
      const t = document.createElement('div');
      t.className = 'node-timings';
      t.textContent = json.nodeTimings;
      meta.appendChild(t);
    }
    card.appendChild(meta);
    renderCallTree(json.callTree, card);

    analysisResult.innerHTML = '';
    analysisResult.appendChild(card);
    loadHistory();
  } catch (e) {
    analysisResult.innerHTML = `<div class="placeholder">${e.message || '分析失败，请重试。'}</div>`;
  } finally {
    analysisBtn.disabled = false;
  }
}


/* ── 工作流定义测试 ── */
let currentWorkflowId = null;
let currentWorkflow = null;
let selectedWorkflowNodeKey = null;

async function apiJson(url, options = {}) {
  const res = await fetch(url, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || '请求失败');
  return data;
}

function setWorkflowStatus(text, isError = false) {
  workflowStatus.textContent = text;
  workflowStatus.classList.toggle('error', isError);
}

async function createWorkflowDemo() {
  const btn = document.getElementById('createWorkflowBtn');
  btn.disabled = true;
  saveDraftBtn.disabled = true;
  saveBranchDraftBtn.disabled = true;
  saveCurrentDraftBtn.disabled = true;
  setWorkflowStatus('正在创建应用和工作流...');
  try {
    const app = await apiJson('/api/apps', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('workflowAppName').value.trim() || '测试应用',
        description: document.getElementById('workflowAppDesc').value.trim()
      })
    });
    const workflow = await apiJson('/api/workflow-definitions', {
      method: 'POST',
      body: JSON.stringify({
        appId: app.id,
        name: document.getElementById('workflowName').value.trim() || '测试工作流',
        description: document.getElementById('workflowDesc').value.trim()
      })
    });
    currentWorkflowId = workflow.id;
    currentWorkflow = workflow;
    saveDraftBtn.disabled = false;
    saveBranchDraftBtn.disabled = false;
    saveCurrentDraftBtn.disabled = false;
    runWorkflowBtn.disabled = false;
    renderWorkflow(workflow);
    setWorkflowStatus(`已新建流程 #${workflow.id}，可以选择一个模板开始。`);
  } catch (e) {
    setWorkflowStatus(e.message || '创建失败', true);
  } finally {
    btn.disabled = false;
  }
}

async function saveSampleDraft() {
  if (!currentWorkflowId) return;
  saveDraftBtn.disabled = true;
  setWorkflowStatus('正在创建智能问答流程...');
  const body = {
    nodes: [
      { key: 'start_001', type: 'start', title: '用户输入', x: 80, y: 180, config: { inputKey: 'query' } },
      { key: 'llm_001', type: 'llm', title: '生成回答', x: 360, y: 180, config: { provider: getProvider(), model: getModel(), prompt: '请根据用户问题给出清晰、自然的回答：{{query}}' } },
      { key: 'end_001', type: 'end', title: '输出结果', x: 640, y: 180, config: { outputKey: 'answer' } }
    ],
    edges: [
      { source: 'start_001', target: 'llm_001' },
      { source: 'llm_001', target: 'end_001' }
    ],
    variables: { query: '', answer: '' }
  };
  try {
    const workflow = await apiJson(`/api/workflow-definitions/${currentWorkflowId}/draft`, {
      method: 'PUT',
      body: JSON.stringify(body)
    });
    currentWorkflow = workflow;
    selectedWorkflowNodeKey = 'llm_001';
    runWorkflowBtn.disabled = false;
    saveCurrentDraftBtn.disabled = false;
    renderWorkflow(workflow);

}

function editableWorkflowPayload() {
  const nodes = (currentWorkflow.nodes || []).map(node => ({
    key: node.key,
    type: node.type,
    title: node.title || node.key,
    x: Number(node.x || 0),
    y: Number(node.y || 0),
    config: node.config || {}
  }));
  const edges = (currentWorkflow.edges || []).map(edge => ({
    source: edge.source,
    target: edge.target,
    sourceHandle: edge.sourceHandle || null,
    targetHandle: edge.targetHandle || null,
    condition: edge.condition || {}
  }));
  return { nodes, edges, variables: currentWorkflow.variables || {} };
}

function addWorkflowStep(type) {
  if (!currentWorkflowId || !currentWorkflow) {
    setWorkflowStatus('请先新建流程，再添加步骤。', true);
    return;
  }
  currentWorkflow.nodes = currentWorkflow.nodes || [];
  currentWorkflow.edges = currentWorkflow.edges || [];
  const node = createWorkflowStep(type);
  const endNode = currentWorkflow.nodes.find(item => item.type === 'end');
  if (endNode) {
    const incomingIndex = currentWorkflow.edges.findIndex(edge => edge.target === endNode.key);
    const incoming = incomingIndex >= 0 ? currentWorkflow.edges[incomingIndex] : null;
    node.x = Number(endNode.x || 0);
    node.y = Number(endNode.y || 0) + (type === 'condition' ? 110 : 0);
    endNode.x = Number(endNode.x || 0) + 240;
    if (incoming) {
      currentWorkflow.edges.splice(incomingIndex, 1, {
        source: incoming.source,
        target: node.key,
        sourceHandle: incoming.sourceHandle || null,
        targetHandle: null,
        condition: incoming.condition || {}
      });
    }
    currentWorkflow.edges.push({ source: node.key, target: endNode.key, sourceHandle: null, targetHandle: null, condition: {} });
    const endIndex = currentWorkflow.nodes.indexOf(endNode);
    currentWorkflow.nodes.splice(endIndex, 0, node);
  } else {
    const lastNode = currentWorkflow.nodes.at(-1);
    node.x = lastNode ? Number(lastNode.x || 0) + 240 : 80;
    node.y = lastNode ? Number(lastNode.y || 180) : 180;
    if (lastNode) {
      currentWorkflow.edges.push({ source: lastNode.key, target: node.key, sourceHandle: null, targetHandle: null, condition: {} });
    }
    currentWorkflow.nodes.push(node);
  }
  selectedWorkflowNodeKey = node.key;
  renderWorkflow(currentWorkflow);
  setWorkflowStatus(`已添加步骤「${node.title}」，记得保存流程设置。`);
}

function deleteWorkflowNode(key) {
  if (!currentWorkflow) return;
  const node = (currentWorkflow.nodes || []).find(n => n.key === key);
  if (!node) return;
  if (node.type === 'start') { setWorkflowStatus('开始节点不能删除。', true); return; }
  currentWorkflow.nodes = currentWorkflow.nodes.filter(n => n.key !== key);
  currentWorkflow.edges = (currentWorkflow.edges || []).filter(e => e.source !== key && e.target !== key);
  if (selectedWorkflowNodeKey === key) selectedWorkflowNodeKey = null;
  renderWorkflow(currentWorkflow);
  setWorkflowStatus(`已删除步骤「${node.title || key}」，记得保存流程设置。`);
}

function createWorkflowStep(type) {
  const suffix = Date.now().toString().slice(-5);
  const defaults = {
    llm: {
      key: `llm_${suffix}`,
      type: 'llm',
      title: '生成回答',
      config: { provider: getProvider(), model: getModel(), prompt: '请根据用户输入生成回答：{{query}}' }
    },
    condition: {
      key: `condition_${suffix}`,
      type: 'condition',
      title: '判断需求',
      config: { variable: 'query', operator: 'contains', value: '简短' }
    },
    set_variable: {
      key: `setvariable_${suffix}`,
      type: 'set_variable',
      title: '设置回答要求',
      config: { assignments: [{ name: 'style', value: '请清晰回答。' }] }
    }
  };
  return {
    ...(defaults[type] || defaults.llm),
    x: 80,
    y: 180
  };
}

async function runCurrentWorkflow() {
  if (!currentWorkflowId) return;
  const text = document.getElementById('workflowRunInput').value.trim();
  if (!text) return;
  runWorkflowBtn.disabled = true;
  workflowRunResult.textContent = '运行中...';
  setWorkflowStatus(`正在运行工作流 #${currentWorkflowId}...`);
  try {
    const result = await apiJson(`/api/workflow-definitions/${currentWorkflowId}/run`, {
      method: 'POST',
      body: JSON.stringify({
        message: text,
        provider: getProvider(),
        model: getModel(),
        enableSearch: getEnableSearch(),
        variables: { query: text }
      })
    });
    workflowRunResult.innerHTML = '';
    renderMarkdown(result.answer || '无输出', workflowRunResult);
    setWorkflowStatus(`运行完成，耗时 ${result.costMs}ms。`);
    loadHistory();
  } catch (e) {
    workflowRunResult.textContent = e.message || '运行失败';
    setWorkflowStatus(e.message || '运行失败', true);
  } finally {
    runWorkflowBtn.disabled = false;
  }
}

function renderWorkflow(workflow) {
  const nodes = workflow.nodes || [];
  const edges = workflow.edges || [];
  if (selectedWorkflowNodeKey && !nodes.some(node => node.key === selectedWorkflowNodeKey)) {
    selectedWorkflowNodeKey = null;
  }
  workflowSummary.innerHTML = `
    <div class="workflow-metric"><span>应用</span><strong>${escapeHtml(workflow.appName || '-')}</strong></div>
    <div class="workflow-metric"><span>工作流</span><strong>#${workflow.id} ${escapeHtml(workflow.name || '-')}</strong></div>
    <div class="workflow-metric"><span>版本</span><strong>v${workflow.versionNumber || '-'}</strong></div>
    <div class="workflow-metric"><span>状态</span><strong>${escapeHtml(workflow.versionStatus || workflow.status || '-')}</strong></div>
  `;

  workflowCanvasSubtitle.textContent = workflow.name ? `#${workflow.id} ${workflow.name}` : '未命名工作流';
  workflowNodeCount.textContent = `${nodes.length} 步骤`;
  workflowEdgeCount.textContent = `${edges.length} 连接`;
  workflowNodeList.innerHTML = nodes.length ? nodes.map(node => `
    <div class="workflow-node-item ${node.key === selectedWorkflowNodeKey ? 'selected' : ''}" onclick="selectWorkflowNode('${escapeAttr(node.key)}')">
      <div class="workflow-node-item-title">${escapeHtml(node.title || node.key)}</div>
      <div class="workflow-node-item-meta">${escapeHtml(nodeTypeName(node.type))}</div>
      <div class="workflow-node-item-desc">${escapeHtml(nodeDescription(node))}</div>
    </div>
  `).join('') : '<div class="empty">暂无节点</div>';
  workflowJson.textContent = JSON.stringify({ nodes, edges, variables: workflow.variables }, null, 2);
  renderNodeEditor();

  if (!nodes.length) {
    workflowCanvas.innerHTML = '<div class="empty">暂无节点</div>';
    return;
  }

  const nodeWidth = 176;
  const nodeHeight = 78;
  const padding = 44;
  const minX = Math.min(...nodes.map(node => Number(node.x || 0)));
  const minY = Math.min(...nodes.map(node => Number(node.y || 0)));
  const positionedNodes = nodes.map(node => ({
    ...node,
    left: Number(node.x || 0) - minX + padding,
    top: Number(node.y || 0) - minY + padding
  }));
  const maxX = Math.max(...positionedNodes.map(node => node.left + nodeWidth + padding));
  const maxY = Math.max(...positionedNodes.map(node => node.top + nodeHeight + padding));
  const byKey = new Map(positionedNodes.map(node => [node.key, node]));

  const edgeSvg = edges.map(edge => {
    const source = byKey.get(edge.source);
    const target = byKey.get(edge.target);
    if (!source || !target) return '';
    const x1 = source.left + nodeWidth;
    const y1 = source.top + nodeHeight / 2;
    const x2 = target.left;
    const y2 = target.top + nodeHeight / 2;
    const midX = Math.max(x1 + 28, x1 + (x2 - x1) / 2);
    const label = edge.sourceHandle || '';
    const labelX = (x1 + x2) / 2;
    const labelY = (y1 + y2) / 2 - 6;
    return `
      <path class="workflow-edge" d="M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}"></path>
      ${label ? `<text class="workflow-edge-label" x="${labelX}" y="${labelY}">${escapeHtml(label)}</text>` : ''}
    `;
  }).join('');

  const nodeHtml = positionedNodes.map(node => {
    const meta = nodeMeta(node.type);
    const deleteBtn = node.type !== 'start'
      ? `<button class="workflow-node-delete" title="删除步骤" onclick="event.stopPropagation();deleteWorkflowNode('${escapeAttr(node.key)}')">✕</button>`
      : '';
    return `
      <div class="workflow-node ${node.key === selectedWorkflowNodeKey ? 'selected' : ''}" style="left:${node.left}px;top:${node.top}px" onclick="selectWorkflowNode('${escapeAttr(node.key)}')">
        ${deleteBtn}
        <div class="workflow-node-head">
          <span class="workflow-node-icon ${escapeAttr(meta.cls)}">${escapeHtml(meta.icon)}</span>
          <div class="workflow-node-title">${escapeHtml(node.title || node.key)}</div>
        </div>
        <div class="workflow-node-type">${escapeHtml(nodeTypeName(node.type))}</div>
        <div class="workflow-node-key">${escapeHtml(node.key)}</div>
        <div class="workflow-node-desc">${escapeHtml(nodeDescription(node))}</div>
      </div>
    `;
  }).join('');

  workflowCanvas.innerHTML = `
    <div class="workflow-viewport" style="width:${maxX}px;height:${maxY}px">
      <svg class="workflow-edges" width="${maxX}" height="${maxY}" viewBox="0 0 ${maxX} ${maxY}" aria-hidden="true">${edgeSvg}</svg>
      ${nodeHtml}
    </div>
  `;
}

function selectWorkflowNode(nodeKey) {
  selectedWorkflowNodeKey = nodeKey;
  renderWorkflow(currentWorkflow);
}

function selectedWorkflowNode() {
  return (currentWorkflow?.nodes || []).find(node => node.key === selectedWorkflowNodeKey) || null;
}

function renderNodeEditor() {
  const node = selectedWorkflowNode();
  if (!node) {
    workflowNodeEditor.innerHTML = '<div class="workflow-editor-empty">选择画布中的步骤后设置它要做什么。</div>';
    return;
  }
  const config = node.config || {};
  const common = `
    <div class="workflow-editor-meta">${escapeHtml(nodeTypeName(node.type))}</div>
    <label>步骤名称
      <input value="${escapeAttr(node.title || '')}" oninput="updateSelectedNodeTitle(this.value)">
    </label>
  `;
  const deleteSection = node.type !== 'start'
    ? `<div style="margin-top:12px;border-top:1px solid #e3e8ef;padding-top:10px"><button onclick="deleteWorkflowNode('${escapeAttr(node.key)}')" style="width:100%;padding:8px 0;border:1px solid #fecaca;border-radius:7px;background:#fff5f5;color:#dc2626;font-size:13px;cursor:pointer;">删除此步骤</button></div>`
    : '';
  workflowNodeEditor.innerHTML = common + editorFieldsForNode(node, config) + deleteSection;
}

function editorFieldsForNode(node, config) {
  switch (node.type) {
    case 'start':
      return `
        <label>用户会输入什么
          <input value="用户问题" disabled>
        </label>
        <details>
          <summary>高级设置</summary>
          <div class="advanced-fields">
            <label>保存为变量
              <input value="${escapeAttr(config.inputKey || 'query')}" oninput="updateSelectedNodeConfig('inputKey', this.value)">
            </label>
          </div>
        </details>
      `;
    case 'llm':
      return `
        <label>你希望 AI 做什么
          <textarea oninput="updateSelectedNodeConfig('prompt', this.value)">${escapeHtml(config.prompt || '{{query}}')}</textarea>
        </label>
        <details>
          <summary>高级设置</summary>
          <div class="advanced-fields">
            <label>模型服务
              <select onchange="updateSelectedNodeConfig('provider', this.value)">
                <option value="tongyi" ${config.provider === 'tongyi' ? 'selected' : ''}>通义千问</option>
                <option value="deepseek" ${config.provider === 'deepseek' ? 'selected' : ''}>DeepSeek</option>
              </select>
            </label>
            <label>模型
              <input value="${escapeAttr(config.model || getModel())}" oninput="updateSelectedNodeConfig('model', this.value)">
            </label>
          </div>
        </details>
      `;
    case 'condition':
      return `
        <label>当用户输入
          <select onchange="updateSelectedNodeConfig('operator', this.value)">
            ${conditionOption('contains', config.operator)}
            ${conditionOption('equals', config.operator)}
            ${conditionOption('not_equals', config.operator)}
            ${conditionOption('not_empty', config.operator)}
            ${conditionOption('empty', config.operator)}
            ${conditionOption('starts_with', config.operator)}
            ${conditionOption('ends_with', config.operator)}
          </select>
        </label>
        <label>关键词或内容
          <input value="${escapeAttr(config.value || '')}" oninput="updateSelectedNodeConfig('value', this.value)">
        </label>
        <details>
          <summary>高级设置</summary>
          <div class="advanced-fields">
            <label>检查哪个变量
              <input value="${escapeAttr(config.variable || 'query')}" oninput="updateSelectedNodeConfig('variable', this.value)">
            </label>
          </div>
        </details>
      `;
    case 'set_variable':
    case 'setvariable': {
      const assignment = (config.assignments || [])[0] || {};
      return `
        <label>要设置的内容
          <input value="${escapeAttr(assignment.name || 'style')}" oninput="updateSelectedAssignment('name', this.value)">
        </label>
        <label>具体说明
          <textarea oninput="updateSelectedAssignment('value', this.value)">${escapeHtml(assignment.value || '')}</textarea>
        </label>
      `;
    }
    case 'end':
      return `
        <label>最终展示给用户
          <input value="AI 回答" disabled>
        </label>
        <details>
          <summary>高级设置</summary>
          <div class="advanced-fields">
            <label>读取哪个变量
              <input value="${escapeAttr(config.outputKey || 'answer')}" oninput="updateSelectedNodeConfig('outputKey', this.value)">
            </label>
          </div>
        </details>
      `;
    default:
      return `
        <label>配置 JSON
          <textarea oninput="updateSelectedNodeConfigJson(this.value)">${escapeHtml(JSON.stringify(config, null, 2))}</textarea>
        </label>
      `;
  }
}

function conditionOption(value, current) {
  const label = {
    contains: '包含',
    equals: '等于',
    not_equals: '不等于',
    not_empty: '非空',
    empty: '为空',
    starts_with: '开头是',
    ends_with: '结尾是'
  }[value] || value;
  return `<option value="${value}" ${value === (current || 'contains') ? 'selected' : ''}>${label}</option>`;
}

function nodeTypeName(type) {
  return {
    start: '用户输入',
    llm: 'AI 生成',
    condition: '判断条件',
    set_variable: '设置内容',
    setvariable: '设置内容',
    end: '输出结果',
    code: '代码处理',
    http: '外部请求',
    loop: '重复执行'
  }[type] || '自定义步骤';
}

function nodeDescription(node) {
  const config = node.config || {};
  switch (node.type) {
    case 'start':
      return '接收用户发来的问题或指令。';
    case 'llm':
      return compactText(config.prompt || '让 AI 根据用户输入生成回答。');
    case 'condition':
      return `当用户输入${conditionText(config.operator || 'contains')}“${config.value || ''}”时走满足分支。`;
    case 'set_variable':
    case 'setvariable': {
      const assignment = (config.assignments || [])[0] || {};
      return compactText(assignment.value || '设置后续步骤会使用的回答要求。');
    }
    case 'end':
      return '把最终回答展示给用户。';
    default:
      return '执行一个自定义处理步骤。';
  }
}

function conditionText(operator) {
  return {
    contains: '包含',
    equals: '等于',
    not_equals: '不等于',
    not_empty: '不为空',
    empty: '为空',
    starts_with: '开头是',
    ends_with: '结尾是'
  }[operator] || operator;
}

function compactText(value) {
  return String(value || '').replace(/\s+/g, ' ').trim();
}

function updateSelectedNodeTitle(value) {
  const node = selectedWorkflowNode();
  if (!node) return;
  node.title = value;
  document.querySelectorAll('.workflow-node.selected .workflow-node-title, .workflow-node-item.selected .workflow-node-item-title')
    .forEach(el => { el.textContent = value || node.key; });
  syncWorkflowDraftView();
}

function updateSelectedNodeConfig(key, value) {
  const node = selectedWorkflowNode();
  if (!node) return;
  node.config = { ...(node.config || {}), [key]: value };
  syncWorkflowDraftView();
}

function updateSelectedAssignment(key, value) {
  const node = selectedWorkflowNode();
  if (!node) return;
  const current = (node.config?.assignments || [])[0] || {};
  node.config = {
    ...(node.config || {}),
    assignments: [{ ...current, [key]: value }]
  };
  syncWorkflowDraftView();
}

function updateSelectedNodeConfigJson(value) {
  const node = selectedWorkflowNode();
  if (!node) return;
  try {
    node.config = JSON.parse(value || '{}');
    syncWorkflowDraftView();
    setWorkflowStatus('配置 JSON 已更新。');
  } catch (e) {
    setWorkflowStatus('配置 JSON 格式不正确。', true);
  }
}

function syncWorkflowDraftView() {
  workflowJson.textContent = JSON.stringify({
    nodes: currentWorkflow?.nodes || [],
    edges: currentWorkflow?.edges || [],
    variables: currentWorkflow?.variables || {}
  }, null, 2);
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll('`', '&#096;');
}

function renderCallTreeHtml(nodes) {
  if (!nodes || !nodes.length) return '';
  const rows = nodes.map((node, index) => {
    const meta = nodeMeta(node.nodeType);
    const depth = Number(node.depth || 0);
    const statusClass = node.status === 'success' ? 'tree-status' : 'tree-status tree-err';
    const statusText = node.status === 'success' ? '✓' : '✕';
    return `<div class="tree-row" style="--depth:${depth}">
      <div class="tree-main">
        <span class="tree-spacer"></span>
        <span class="tree-caret">${index < nodes.length - 1 ? '⌄' : ''}</span>
        <span class="${statusClass}">${statusText}</span>
        <span class="tree-badge ${escapeAttr(meta.cls)}">${escapeHtml(meta.icon)}</span>
        <span class="tree-label">${escapeHtml(`${meta.label} ${node.nodeId || ''}`.trim())}</span>
      </div>
      <span class="tree-cost">${escapeHtml(node.costMs ?? 0)}ms</span>
    </div>`;
  }).join('');
  return `<div class="call-tree"><div class="call-tree-title">调用树</div>${rows}</div>`;
}
/* ── 历史记录 ── */
async function loadHistory() {
  try {
    const res  = await fetch('/api/executions');
    const list = await res.json();
    if (!list.length) { historyList.innerHTML = '<div class="empty">暂无对话</div>'; return; }
    historyList.innerHTML = list.map(r => {
      const cls = r.intent === '数据分析' || r.workflowType === 'analysis' ? 'intent-数据分析'
                : r.intent?.includes('问题') ? 'intent-问题' : 'intent-other';
      const typeLabel = r.workflowType === 'analysis' ? '数据分析' : r.workflowType === 'definition' ? '工作流' : '对话';
      const providerLabel = r.provider === 'deepseek' ? 'DeepSeek' : '通义';
      return `<div class="record">
        <div class="record-time"><span>${r.timestamp}</span><span>#${r.id || ''}</span></div>
        <span class="record-intent ${cls}">${typeLabel}</span>
        ${r.model ? `<span class="record-intent intent-other" style="margin-left:4px">${escapeHtml(r.model)}</span>` : ''}
        ${r.provider ? `<span class="record-intent intent-other" style="margin-left:4px;background:#e8f4fd;color:#1a73e8">${providerLabel}</span>` : ''}
        <div class="history-chat">
          <div class="history-message">
            <div class="history-role">用户</div>
            <div class="history-bubble user">${escapeHtml(r.userMessage || '')}</div>
          </div>
          <div class="history-message">
            <div class="history-role">助手</div>
            <div class="history-bubble assistant">${escapeHtml(r.assistantMessage || '')}</div>
          </div>
        </div>
        <div class="record-cost">耗时 ${r.costMs}ms${r.nodeTimings ? `<span class="node-timings" style="display:inline;margin:0 0 0 6px">${escapeHtml(r.nodeTimings)}</span>` : ''}</div>
        ${renderCallTreeHtml(r.callTree)}
      </div>`;
    }).join('');
  } catch(e) {}
}

loadHistory();
</script>
