spring:
  application:
    name: ai-workflow
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${AIFLOW_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aiflow}
    driver-class-name: ${AIFLOW_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${AIFLOW_DATASOURCE_USERNAME:aiflow}
    password: ${AIFLOW_DATASOURCE_PASSWORD:aiflow_dev_password}
  h2:
    console:
      enabled: false
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key-here}
      chat:
        options:
          model: ${DASHSCOPE_MODEL:qwen-max}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key-here}

server:
  port: ${SERVER_PORT:8080}
